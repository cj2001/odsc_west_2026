version: '3.8'

networks:
  erkg-network:
    driver: bridge

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: erkg_portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    ports:
      - "9000:9000"
      - "9443:9443"
    networks:
      - erkg-network

  postgres:
    # The pre-loaded workshop database: 39,413 records already entity-resolved
    # and geocoded. Attendees cannot build this themselves - a free Senzing
    # licence caps loading at 500 records - but reading a resolved database is
    # unlimited, so shipping it this way removes the licence from their setup.
    # Built from docker/postgres/; restores itself on first boot.
    image: ghcr.io/cj2001/erkg-db:west-2026
    container_name: erkg_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: workshop
      POSTGRES_DB: erkg
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Deliberately stronger than pg_isready, in two ways that both matter.
      #
      # It runs a real query, so "healthy" means the database is genuinely
      # queryable - not merely that some server process accepted a connection.
      #
      # And it connects over TCP (-h 127.0.0.1) rather than the unix socket.
      # While Postgres runs its first-boot scripts it listens on the socket
      # ONLY, then stops that temporary server and starts the real one. A
      # socket-based check goes green during that gap, senzing starts, and its
      # TCP connection is refused - which crash-loops it until Postgres finally
      # comes up. Requiring TCP keeps us red until first-boot work has finished,
      # which is also what makes this safe once a dump restore runs on boot.
      test: ["CMD-SHELL", "PGPASSWORD=workshop psql -h 127.0.0.1 -U postgres -d erkg -tAc 'SELECT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    networks:
      - erkg-network
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1

  resolver:
    image: senzing/serve-grpc:latest
    container_name: erkg_resolver
    ports:
      - "8261:8261"
    environment:
      SENZING_ENGINE_CONFIGURATION_JSON: >
        {
          "PIPELINE": {
            "CONFIGPATH": "/etc/opt/senzing",
            "RESOURCEPATH": "/opt/senzing/er/resources",
            "SUPPORTPATH": "/opt/senzing/data",
            "LICENSESTRINGBASE64": "${SENZING_LICENSE_BASE64}"
          },
          "SQL": {
            "CONNECTION": "postgresql://postgres:workshop@postgres:5432:erkg?sslmode=disable"
          }
        }
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - erkg-network

  sandbox:
    # An EMPTY Senzing repository for attendees to load their own records into.
    #
    # Deliberately gets NO licence, even when one is present in .env: the free
    # 500-record limit is what attendees experience, so this must behave the
    # same here as it does for them. A licence here would hide breakage.
    image: senzing/serve-grpc:latest
    container_name: erkg_sandbox
    ports:
      - "8262:8261"
    environment:
      SENZING_ENGINE_CONFIGURATION_JSON: >
        {
          "PIPELINE": {
            "CONFIGPATH": "/etc/opt/senzing",
            "RESOURCEPATH": "/opt/senzing/er/resources",
            "SUPPORTPATH": "/opt/senzing/data"
          },
          "SQL": {
            "CONNECTION": "postgresql://postgres:workshop@postgres:5432:sandbox?sslmode=disable"
          }
        }
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - erkg-network

  jupyter:
    image: ghcr.io/cj2001/erkg-jupyter:west-2026
    build: .
    container_name: erkg_jupyter
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "18888:8888"
    volumes:
      - ./notebooks:/workspace/notebooks
      - ./data:/workspace/data
      - lancedb_data:/workspace/lancedb_data
    env_file:
      - .env
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      NB_UID: "${HOST_UID:-1000}"
      NB_GID: "${HOST_GID:-1000}"
      CHOWN_HOME: "yes"
      CHOWN_HOME_OPTS: "-R"
      # Senzing connection info
      SENZING_GRPC_HOST: resolver
      SENZING_GRPC_PORT: 8261
      # the empty repository attendees can load into
      SANDBOX_GRPC_HOST: sandbox
      SANDBOX_GRPC_PORT: 8261
      # Database connection info
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: workshop
      POSTGRES_DB: erkg
      # Senzing engine config
      SENZING_ENGINE_CONFIGURATION_JSON: >
        {
          "PIPELINE": {
            "CONFIGPATH": "/etc/opt/senzing",
            "RESOURCEPATH": "/opt/senzing/er/resources",
            "SUPPORTPATH": "/opt/senzing/data",
            "LICENSESTRINGBASE64": "${SENZING_LICENSE_BASE64}"
          },
          "SQL": {
            "CONNECTION": "postgresql://postgres:workshop@postgres:5432:erkg?sslmode=disable"
          }
        }
    depends_on:
      - resolver
      - sandbox
      - postgres
    restart: unless-stopped
    networks:
      - erkg-network
    command: >
      bash -c "jupyter lab --ip=0.0.0.0 --port=8888 --no-browser 
      --allow-root --NotebookApp.token='' --NotebookApp.password=''"

volumes:
  portainer_data:
  postgres_data:
  lancedb_data: